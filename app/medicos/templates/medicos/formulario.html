{% extends "base.html" %}
{% block title %}{{ 'Editar' if medico else 'Nuevo' }} medico{% endblock %}

{% block content %}
<div class="card col-md-6">
    <div class="card-header"><h4 class="mb-0">{{ 'Editar' if medico else 'Nuevo' }} medico</h4></div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" value="{{ medico.nombre if medico else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Especialidad</label>
                <input type="text" name="especialidad" class="form-control" value="{{ medico.especialidad if medico else '' }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('medicos.lista') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
