{% extends "base.html" %}
{% block title %}{{ 'Editar' if paciente else 'Nuevo' }} paciente{% endblock %}

{% block content %}
<div class="card col-md-6">
    <div class="card-header"><h4 class="mb-0">{{ 'Editar' if paciente else 'Nuevo' }} paciente</h4></div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" value="{{ paciente.nombre if paciente else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Telefono</label>
                <input type="text" name="telefono" class="form-control" value="{{ paciente.telefono if paciente else '' }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('pacientes.lista') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
